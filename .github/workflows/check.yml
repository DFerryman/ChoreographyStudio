name: Check preview
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/requirements-avatar-fit.txt
      - run: python -m pip install -r infra/requirements-avatar-fit.txt
      - run: npm run avatar:fit -- --check
      - run: npm run avatar:fit:test
      - run: npm run check
      - run: npm run typecheck:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-test-results
          path: test-results/
